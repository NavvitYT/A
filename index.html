<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twibook - Fuera de Servicio</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 30px;
            max-width: 400px;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1d9bf0;
            margin-bottom: 20px;
        }
        h1 { font-size: 1.6rem; margin-bottom: 10px; color: #ff4b4b; }
        p { color: #bbbbbb; font-size: 1.1rem; line-height: 1.4; }
        
        .box {
            margin-top: 25px;
            padding: 20px;
            background: #161616;
            border-radius: 15px;
            border: 1px solid #252525;
        }
        .highlight { color: #ffcc00; font-weight: bold; }
        .footer { margin-top: 40px; font-size: 0.8rem; color: #444; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Twibook</div>
        <h1>Servidor Caído</h1>
        <p>Lo sentimos, la plataforma no está disponible ahora mismo.</p>
        
        <div class="box">
            <p>Se fue la luz por aquí (<span class="highlight">EdeEste</span>) y el servidor se apagó. <br><br>
            Lo más probable es que <b>vuelva muy tarde</b>, así que no se queden esperando. En cuanto manden la luz, subimos todo de nuevo.</p>
        </div>

        <div class="footer">
            Admin: Derek — Chequea más tarde.
        </div>
    </div>
</body>
</html>
