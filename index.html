<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twibook - Oh no!</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #0f111a; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }
        .container { 
            text-align: center; 
            padding: 40px 20px; 
            background: #1a1d29; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            max-width: 90%;
            width: 450px;
            border: 1px solid #333644;
        }
        .icon-box {
            background: rgba(142, 68, 173, 0.1);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 40px;
        }
        h1 { 
            color: #a29bfe; 
            margin-bottom: 15px; 
            font-size: 28px;
            letter-spacing: -0.5px;
        }
        p { 
            color: #b0b3b8; 
            line-height: 1.6; 
            font-size: 16px;
            margin-bottom: 25px;
        }
        .loader {
            border: 3px solid rgba(142, 68, 173, 0.2);
            border-top: 3px solid #8e44ad;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer-text {
            margin-top: 30px;
            font-size: 12px;
            color: #4a4d53;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-box">⚡</div>
        <h1>¡Oh no, Twibook!</h1>
        <p>Nuestros servidores están fuera de línea temporalmente debido a un fallo eléctrico grave en nuestra zona.</p>
        <div class="loader"></div>
        <p style="margin-top: 20px; font-size: 14px;">Estamos trabajando para que el "malpari---" de MySQL y el resto del sistema vuelvan pronto.</p>
        <div class="footer-text">Estado: Esperando restablecimiento de energía</div>
    </div>
</body>
</html>
